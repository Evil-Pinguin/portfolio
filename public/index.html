<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Портфолио</title>
  <script>
    // Тема применяется до отрисовки, чтобы не было вспышки светлого фона
    (function () {
      try {
        if (localStorage.getItem('portfolio-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="gh-header">
    <div class="gh-brand">
      <span class="gh-logo">📁</span>
      <span>Портфолио</span>
    </div>
    <div class="gh-actions">
      <button class="btn" data-action="toggleTheme" id="themeBtn">🌙 Тёмная тема</button>
      <button class="btn btn-primary" data-action="new">+ Новый проект</button>
    </div>
  </header>
  <div class="app">
    <aside id="sidebar"></aside>
    <main id="main"></main>
  </div>
  <input type="file" id="iconFile" accept="image/*" hidden>
  <input type="file" id="imageFile" accept="image/*" multiple hidden>
  <script src="app.js"></script>
</body>
</html>
